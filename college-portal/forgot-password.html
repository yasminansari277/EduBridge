<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — EduBridge Portal</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-header">
      <a href="index.html" class="auth-brand">
        <i class="fas fa-graduation-cap"></i> EduBridge
      </a>
      <p class="auth-subtitle">Reset your account password</p>
    </div>

    <div class="auth-body">
      <div id="forgot-success-message" class="auth-notice" style="display:none; background:#ecfdf5; border-color:#a7f3d0;"></div>

      <form id="forgot-password-form">
        <p class="text-sm text-muted mb-4">
          Enter your registered college email address below. We will send a demonstration password recovery instructions link.
        </p>

        <div class="form-group">
          <label class="form-label" for="forgot-email">Registered Email Address</label>
          <input type="email" id="forgot-email" class="form-control" placeholder="name@college.edu" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 btn-lg">
          <i class="fas fa-paper-plane"></i> Send Password Reset Link
        </button>
      </form>

      <div class="auth-footer-links text-center mt-4">
        <a href="login.html"><i class="fas fa-arrow-left"></i> Back to Login</a>
      </div>
    </div>
  </div>

  <script src="js/mock-data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
