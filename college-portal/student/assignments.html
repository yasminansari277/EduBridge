<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Assignments — EduBridge</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/student.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="../index.html" class="sidebar-brand">
          <i class="fas fa-graduation-cap"></i> EduBridge
        </a>
        <span class="sidebar-role-badge">Student</span>
      </div>

      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item-link"><i class="fas fa-chart-line"></i> Dashboard</a>
        <a href="resources.html" class="nav-item-link"><i class="fas fa-book-open"></i> Resources</a>
        <a href="assignments.html" class="nav-item-link active"><i class="fas fa-tasks"></i> Assignments</a>
        <a href="submissions.html" class="nav-item-link"><i class="fas fa-file-upload"></i> My Submissions</a>
        <a href="grades.html" class="nav-item-link"><i class="fas fa-award"></i> Grades & Feedback</a>
        <a href="profile.html" class="nav-item-link"><i class="fas fa-user-cog"></i> Profile</a>
      </nav>

      <div class="sidebar-footer">
        <button class="btn btn-outline w-100" style="color:#ef4444; border-color:rgba(239,68,68,0.3);" onclick="EduBridge.logout()">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="topbar">
        <div class="d-flex align-items-center gap-3">
          <button class="sidebar-toggle-btn" id="sidebar-toggle"><i class="fas fa-bars"></i></button>
          <div class="topbar-search">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="Search assignments...">
          </div>
        </div>

        <div class="topbar-actions">
          <a href="profile.html" class="user-profile-menu">
            <div class="avatar user-avatar-text">AS</div>
            <div class="user-info-text">
              <div class="user-name user-name-text">Aarav Sharma</div>
              <div class="user-role-title">BCA III • Sem 5</div>
            </div>
          </a>
        </div>
      </header>

      <main class="content-body">
        <div class="page-header">
          <div>
            <h1 class="page-title">Assignments</h1>
            <p class="page-subtitle">Track homework tasks, submit your work before deadlines, and check review status.</p>
          </div>
        </div>

        <!-- Filter Tabs -->
        <div class="tabs">
          <button class="tab-btn asg-tab-btn active" data-tab="all">All Assignments</button>
          <button class="tab-btn asg-tab-btn" data-tab="pending">Pending Submission</button>
          <button class="tab-btn asg-tab-btn" data-tab="submitted">Submitted</button>
          <button class="tab-btn asg-tab-btn" data-tab="graded">Graded</button>
          <button class="tab-btn asg-tab-btn" data-tab="overdue">Overdue</button>
        </div>

        <div id="student-assignments-list">
          <!-- Dynamically populated by student.js -->
        </div>
      </main>

      <footer class="app-footer">
        &copy; 2026 EduBridge Portal. All rights reserved. BCA III Mini Project.
      </footer>
    </div>
  </div>

  <script src="../js/mock-data.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/assignments.js"></script>
  <script src="../js/student.js"></script>
</body>
</html>
