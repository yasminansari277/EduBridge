<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — EduBridge Portal</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-header">
      <a href="index.html" class="auth-brand">
        <i class="fas fa-graduation-cap"></i> EduBridge
      </a>
      <p class="auth-subtitle">Online College Notes & Assignment Sharing Portal</p>
    </div>

    <div class="auth-body">
      <!-- Role Demo Tab Switcher -->
      <div class="role-tabs">
        <button type="button" class="role-tab-btn active" data-role="student">
          <i class="fas fa-user-graduate"></i> Student
        </button>
        <button type="button" class="role-tab-btn" data-role="teacher">
          <i class="fas fa-chalkboard-teacher"></i> Teacher
        </button>
        <button type="button" class="role-tab-btn" data-role="admin">
          <i class="fas fa-user-shield"></i> Admin
        </button>
      </div>

      <div class="auth-notice">
        <i class="fas fa-info-circle"></i>
        <span><strong>Demo Portal Mode:</strong> Switching tabs auto-fills sample credentials for presentation.</span>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input type="email" id="login-email" class="form-control" placeholder="name@college.edu" value="aarav.student@college.edu" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <div class="password-input-group">
            <input type="password" id="login-password" class="form-control" placeholder="••••••••" value="password123" required>
            <button type="button" class="password-toggle-btn"><i class="fas fa-eye"></i></button>
          </div>
        </div>

        <div class="d-flex justify-between align-items-center mb-4">
          <label class="form-check">
            <input type="checkbox" id="remember-me" checked>
            <span>Remember me</span>
          </label>
          <a href="forgot-password.html" class="text-sm">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-primary w-100 btn-lg">
          <i class="fas fa-sign-in-alt"></i> Login to Portal
        </button>
      </form>

      <div class="auth-footer-links text-center mt-4">
        <span class="text-muted">Don't have an account?</span>
        <a href="register.html" class="font-semibold">Register Here</a>
      </div>
    </div>
  </div>

  <script src="js/mock-data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
